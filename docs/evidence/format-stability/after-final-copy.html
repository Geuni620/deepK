<meta charset="utf-8"><ul><li>결과 설명: 원하는 결과를 일상적인 말로 설명하세요. 바꾸고 싶은 내용이 분명하면 레이아웃, 조판, 색상처럼 구체적인 작업을 지정하세요.</li><li>검토 요청: 디자인을 어렵게 만드는 문제와 시작할 지점을 확인하세요. 어떤 변경을 적용할지는 직접 선택합니다.</li><li>대안 비교: 요소와 원하는 방향을 전달하면 여러 안을 비교할 수 있습니다. 소스에 유지할 버전을 고르세요.</li><li>페이지 가리키기: 바꾸려는 요소를 직접 선택하세요. 페이지 전반에 적용할 방향도 지정할 수 있습니다.</li></ul>
