<meta charset='utf-8'><p style="color: rgb(26, 26, 26); font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">Use <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/map"><code style="font-family: Menlo, Consolas, monospace;">Array.prototype.map()</code></a> to build a new array:</p><div class="code-example" style="color: rgb(26, 26, 26); font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;"><div class="example-header" style="display: flex; justify-content: space-between;"><span class="language-name" style="font-size: 13px;">js</span><button type="button" class="icon copy-icon" style="display: inline-flex; border: 0px; background: none;"><span class="visually-hidden" style="border: 0px; clip: rect(0px, 0px, 0px, 0px); height: 1px; margin: -1px; overflow: hidden; padding: 0px; position: absolute; white-space: nowrap; width: 1px;">Copy to Clipboard</span></button></div><pre class="brush: js notranslate" style="font-family: Menlo, Consolas, monospace; white-space: pre;"><code style="font-family: Menlo, Consolas, monospace;"><span class="token keyword">const</span> doubled <span class="token operator">=</span> numbers<span class="token punctuation">.</span><span class="token function">map</span><span class="token punctuation">(</span><span class="token parameter">n</span> <span class="token operator">=&gt;</span> n <span class="token operator">*</span> <span class="token number">2</span><span class="token punctuation">)</span><span class="token punctuation">;</span></code></pre></div><p style="color: rgb(26, 26, 26); font-family: -apple-system, Helvetica, Arial, sans-serif; font-size: 16px; font-style: normal; font-variant-ligatures: normal; font-variant-caps: normal; font-weight: 400; letter-spacing: normal; orphans: 2; text-align: start; text-indent: 0px; text-transform: none; widows: 2; word-spacing: 0px; -webkit-text-stroke-width: 0px; white-space: normal; text-decoration-thickness: initial; text-decoration-style: initial; text-decoration-color: initial;">The callback runs once for each element. Use <code style="font-family: Menlo, Consolas, monospace;">forEach()</code> when you need no new array.</p>
